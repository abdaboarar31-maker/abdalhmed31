<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تصاميم CSS | Abd Code</title>
<style>
  body { margin: 0; background: #0f172a; color: #fff; font-family: Tahoma, Arial, sans-serif; }
  header { text-align: center; padding: 40px 16px 10px; }
  header h1 { margin: 0 0 8px; }
  header p { color: #94a3b8; margin: 0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px; max-width: 1100px; margin: 30px auto; padding: 0 16px; }
  .card { background: #1e293b; border-radius: 18px; padding: 18px; }
  .card h2 { font-size: 18px; margin: 0 0 12px; }
  iframe { width: 100%; aspect-ratio: 9 / 16; max-height: 520px; border: 0; border-radius: 12px; background: #000; }
  pre { direction: ltr; text-align: left; background: #020617; color: #7dd3fc; padding: 12px; border-radius: 12px; overflow-x: auto; font-size: 13px; max-height: 220px; }
  button { width: 100%; padding: 12px; border: none; border-radius: 10px; background: #6366f1; color: #fff; font-size: 16px; cursor: pointer; }
  button:hover { background: #4f46e5; }
  a.back { display: block; text-align: center; color: #38bdf8; padding-bottom: 40px; }
</style>
</head>
<body>
  <header>
    <h1>تصاميم CSS ✨</h1>
    <p>شاهد النتيجة وانسخ الكود مجاناً</p>
  </header>

  <div class="grid" id="grid"></div>
  <a class="back" href="index.html">← الرجوع للرئيسية</a>

<script>
/* ضع هنا الـ ID لكل فيديو من يوتيوب (الرمز اللي بعد /shorts/ بالرابط) */
const designs = [
  {
    title: "زر متحرك بألوان متوهجة",
    id: "vRUp836ArNU",
    code: `<button class="btn">اضغط هنا ✨</button>

.btn {
  padding: 18px 50px;
  font-size: 22px;
  color: white;
  border: none;
  border-radius: 50px;
  background: linear-gradient(90deg, #06b6d4, #8b5cf6, #ec4899);
  background-size: 200% 200%;
  animation: move 4s ease infinite;
  box-shadow: 0 0 20px #8b5cf6;
}

@keyframes move {
  0%   { background-position: 0% 50%; }
  50%  { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}`
  },
  {
    title: "لودينج متحرك",
    id: "UYz0bMRL5ZU",
    code: `<div class="loader"></div>

.loader {
  width: 60px;
  height: 60px;
  border: 6px solid #334155;
  border-top-color: #38bdf8;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}`
  },
  {
    title: "زر تشغيل وإيقاف",
    id: "ضع_ID_التشغيل_هنا",
    code: `<label>
  <input type="checkbox">
  <span class="slider"></span>
</label>

input {
  display: none;
}

.slider {
  display: block;
  width: 90px;
  height: 48px;
  background: #475569;
  border-radius: 50px;
  position: relative;
  transition: 0.3s;
}

.slider::before {
  content: "";
  position: absolute;
  width: 38px;
  height: 38px;
  top: 5px;
  left: 5px;
  background: white;
  border-radius: 50%;
  transition: 0.3s;
}

input:checked + .slider {
  background: #22c55e;
}

input:checked + .slider::before {
  transform: translateX(42px);
}`
  },
  {
    title: "كرت بيطير لما تلمسه",
    id: "ضع_ID_الكرت_هنا",
    code: `<div class="card">مرّر عليّ</div>

.card {
  width: 200px;
  padding: 40px 20px;
  text-align: center;
  color: white;
  font-size: 22px;
  border-radius: 20px;
  background: linear-gradient(135deg, #6366f1, #ec4899);
  transition: 0.4s;
}

.card:hover {
  transform: translateY(-15px) rotate(-3deg);
  box-shadow: 0 20px 40px #ec489980;
}`
  }
];

const grid = document.getElementById("grid");
designs.forEach((d, i) => {
  const card = document.createElement("div");
  card.className = "card";
  const h = document.createElement("h2");
  h.textContent = d.title;
  card.appendChild(h);

  if (d.id && !d.id.startsWith("ضع_")) {
    const f = document.createElement("iframe");
    f.src = "https://www.youtube.com/embed/" + d.id;
    f.allowFullscreen = true;
    card.appendChild(f);
  }

  const pre = document.createElement("pre");
  pre.textContent = d.code;
  card.appendChild(pre);

  const b = document.createElement("button");
  b.textContent = "نسخ الكود";
  b.onclick = () => {
    navigator.clipboard.writeText(d.code);
    b.textContent = "تم النسخ ✅";
    setTimeout(() => (b.textContent = "نسخ الكود"), 2000);
  };
  card.appendChild(b);
  grid.appendChild(card);
});
</script>
</body>
</html>
