<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>أكواد HTML و CSS جاهزة للنسخ مجاناً | عبد كود</title>
<meta name="description" content="أكواد HTML وCSS جاهزة مع معاينة حية وزر نسخ: أزرار، كروت، أنيميشن. انسخ وحط بموقعك مجاناً.">
<meta property="og:title" content="أكواد HTML و CSS جاهزة للنسخ مجاناً | عبد كود">
<meta property="og:description" content="انسخ الكود وحطه بموقعك بثانية، مع معاينة حية.">
<style>
:root{--bg:#0a0f1f;--card:#111a33;--line:#24305e;--tx:#f4f6ff;--mut:#9aa6cf;--a:#ff5a1f;--b:#ffc23c;--ok:#2ee6d6}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font-family:Tahoma,Arial,sans-serif;line-height:1.6;padding:0 16px 48px}
header{max-width:1000px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;padding:18px 0}
header a{color:var(--tx);text-decoration:none;font-weight:700}
.logo{font-size:1.2rem;background:linear-gradient(90deg,var(--b),var(--a));-webkit-background-clip:text;background-clip:text;color:transparent}
h1{max-width:1000px;margin:18px auto 6px;font-size:clamp(1.5rem,5vw,2.4rem)}
.sub{max-width:1000px;margin:0 auto 20px;color:var(--mut)}
.tabs{max-width:1000px;margin:0 auto 20px;display:flex;gap:8px;flex-wrap:wrap}
.tabs button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 18px;cursor:pointer}
.tabs button.on{background:var(--a);border-color:var(--a)}
.grid{max-width:1000px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.card h2{font-size:1rem;padding:12px 14px 8px}
iframe{width:100%;height:170px;border:0;border-block:1px solid var(--line)}
pre{direction:ltr;text-align:left;margin:0;padding:12px 14px;max-height:120px;overflow:auto;font:12px/1.5 Consolas,monospace;color:var(--ok);background:#0a1126;white-space:pre-wrap}
.cn{color:var(--mut);padding:6px 14px;font-size:.85rem}.cn:empty{display:none}
.cp{font:inherit;font-weight:700;border:0;background:var(--b);color:#1b1200;padding:10px;cursor:pointer}
.cp.done{background:var(--ok)}
.cp:focus-visible,.tabs button:focus-visible{outline:3px solid #fff;outline-offset:2px}
footer{max-width:1000px;margin:32px auto 0;color:var(--mut);text-align:center}
</style>
</head>
<body>
<header><a class="logo" href="index.html">عبد كود</a><a href="index.html">الرئيسية</a></header>
<h1>أكواد جاهزة للنسخ 🔥</h1>
<p class="sub">اختر التصميم، شوف المعاينة، واضغط "انسخ الكود" وحطه بموقعك. مجاناً.</p>
<div class="tabs" id="tabs"></div>
<main class="grid" id="grid"></main>
<footer>شفت كود عجبك؟ اكتب بتعليقات القناة شو الكود الجاي 👇</footer>
<script>
const D=[
{c:'أزرار',t:'زر متوهج',k:`<button class="btn">اضغط هنا</button>
<style>
.btn{padding:14px 34px;border:0;border-radius:50px;font-size:18px;color:#fff;background:linear-gradient(90deg,#ff5a1f,#ffc23c);cursor:pointer;box-shadow:0 0 20px #ff5a1f88;transition:.3s}
.btn:hover{transform:scale(1.08);box-shadow:0 0 35px #ff5a1f}
</style>`},
{c:'أزرار',t:'زر تبديل (Toggle)',k:`<label class="sw"><input type="checkbox"><span></span></label>
<style>
.sw{position:relative;width:64px;height:34px}
.sw input{display:none}
.sw span{position:absolute;inset:0;background:#445;border-radius:34px;cursor:pointer;transition:.3s}
.sw span::before{content:"";position:absolute;width:26px;height:26px;top:4px;left:4px;background:#fff;border-radius:50%;transition:.3s}
.sw input:checked+span{background:#2ee6d6}
.sw input:checked+span::before{transform:translateX(30px)}
</style>`},
{c:'كروت',t:'كرت زجاجي',k:`<div class="glass"><h3>كرت زجاجي</h3><p>تصميم بسيط وأنيق</p></div>
<style>
body{background:linear-gradient(135deg,#ff5a1f,#3a1cff)}
.glass{padding:28px 36px;color:#fff;text-align:center;background:rgba(255,255,255,.15);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.35);border-radius:20px}
</style>`},
{c:'كروت',t:'كرت يرتفع عند المرور',k:`<div class="card"><h3>مرّر الماوس</h3><p>أو المس الكرت</p></div>
<style>
.card{background:#fff;color:#111;padding:28px 36px;border-radius:16px;text-align:center;transition:.3s;box-shadow:0 4px 12px #0004}
.card:hover{transform:translateY(-12px);box-shadow:0 20px 30px #0006}
</style>`},
{c:'أنيميشن',t:'دائرة تحميل',k:`<div class="spin"></div>
<style>
.spin{width:54px;height:54px;border:6px solid #fff3;border-top-color:#2ee6d6;border-radius:50%;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
</style>`},
{c:'نصوص',t:'نص بتدرج لوني',k:`<h1 class="g">عبد كود 🔥</h1>
<style>
.g{font-size:44px;background:linear-gradient(90deg,#ffc23c,#ff5a1f,#ff2e93);-webkit-background-clip:text;background-clip:text;color:transparent}
</style>`}
];
const NS='abd-abu-arar-site';
async function cnt(op,k){try{const r=await fetch('https://abacus.jasoncameron.dev/'+op+'/'+NS+'/'+k);return r.ok?(await r.json()).value:(r.status===404?0:null)}catch(_){return null}}
const showCn=(el,n)=>{el.textContent=n>0?'📋 اننسخ '+n.toLocaleString('en')+' مرة':''};
const cats=['الكل',...new Set(D.map(d=>d.c))],tabs=document.getElementById('tabs'),grid=document.getElementById('grid');
function draw(c){
  grid.innerHTML='';
  D.filter(d=>c==='الكل'||d.c===c).forEach(d=>{
    const e=document.createElement('article');e.className='card';
    e.innerHTML='<h2></h2><iframe title="معاينة"></iframe><pre></pre><small class="cn"></small><button class="cp">انسخ الكود</button>';
    e.querySelector('h2').textContent=d.t;
    e.querySelector('pre').textContent=d.k;
    e.querySelector('iframe').srcdoc='<body style="margin:0;display:grid;place-items:center;height:100vh;background:#0b1220;font-family:sans-serif">'+d.k;
    const b=e.querySelector('.cp'),cn=e.querySelector('.cn'),key='copy-'+D.indexOf(d);
    cnt('get',key).then(n=>{if(n!=null)showCn(cn,n)});
    b.onclick=async()=>{
      try{await navigator.clipboard.writeText(d.k)}catch(_){const t=document.createElement('textarea');t.value=d.k;document.body.append(t);t.select();document.execCommand('copy');t.remove()}
      cnt('hit',key).then(n=>{if(n!=null)showCn(cn,n)});
      b.textContent='تم النسخ ✓';b.classList.add('done');setTimeout(()=>{b.textContent='انسخ الكود';b.classList.remove('done')},1800);
    };
    grid.append(e);
  });
}
cats.forEach((c,i)=>{const b=document.createElement('button');b.textContent=c;if(!i)b.className='on';b.onclick=()=>{[...tabs.children].forEach(x=>x.className='');b.className='on';draw(c)};tabs.append(b)});
draw('الكل');
</script>
</body>
</html>
