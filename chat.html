<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اسأل مساعد Abd Code</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef1f7; --panel:#ffffff; --ink:#1b2236; --muted:#6b7490;
    --brand:#3b4cca; --brand-soft:#e6e9fb; --line:#dde2ef; --bot:#f3f5fb;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;
    background:var(--bg);color:var(--ink);font-family:"Tajawal",Tahoma,sans-serif}
  .chat{width:100%;max-width:640px;height:min(86vh,720px);display:flex;flex-direction:column;
    background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;
    box-shadow:0 12px 40px rgba(40,50,100,.12)}
  header{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
  .logo{font-family:Consolas,monospace;font-weight:700;font-size:15px;direction:ltr;
    background:var(--brand);color:#fff;border-radius:10px;padding:8px 10px}
  header h1{margin:0;font-size:18px;font-weight:800}
  header p{margin:2px 0 0;font-size:13px;color:var(--muted)}
  #log{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
  .msg{max-width:84%;padding:11px 15px;border-radius:14px;line-height:1.8;font-size:16px;
    white-space:pre-wrap;word-break:break-word}
  .bot{background:var(--bot);align-self:flex-start;border-top-right-radius:4px}
  .me{background:var(--brand);color:#fff;align-self:flex-end;border-top-left-radius:4px}
  .msg code,.msg pre{font-family:Consolas,monospace;direction:ltr;text-align:left}
  .msg pre{background:#1b2236;color:#e8ecff;padding:12px;border-radius:10px;overflow-x:auto;
    white-space:pre;margin:8px 0}
  .msg :not(pre)>code{background:rgba(0,0,0,.08);padding:1px 6px;border-radius:5px}
  .typing{color:var(--muted)}
  .chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 20px 12px}
  .chips button{font:inherit;font-size:14px;background:var(--brand-soft);color:var(--brand);
    border:0;border-radius:999px;padding:7px 14px;cursor:pointer}
  form{display:flex;gap:10px;padding:14px 16px;border-top:1px solid var(--line)}
  textarea{flex:1;resize:none;font:inherit;font-size:16px;border:1px solid var(--line);
    border-radius:12px;padding:10px 14px;height:46px;background:#fff;color:var(--ink)}
  textarea:focus,button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
  #send{font:inherit;font-weight:800;background:var(--brand);color:#fff;border:0;
    border-radius:12px;padding:0 22px;cursor:pointer}
  #send:disabled{opacity:.5;cursor:not-allowed}
  html.embed body{padding:0;display:block;background:#fff}
  html.embed .chat{height:100vh;max-width:none;border:0;border-radius:0;box-shadow:none}
</style>
<script>if(location.search.indexOf("embed")>-1)document.documentElement.classList.add("embed")</script>
</head>
<body>
<main class="chat">
  <header>
    <div class="logo">&lt;/&gt;</div>
    <div>
      <h1>مساعد Abd Code</h1>
      <p>اسأل عن HTML وCSS وJavaScript</p>
    </div>
  </header>

  <div id="log" aria-live="polite">
    <div class="msg bot">أهلاً! اكتب سؤالك وبجاوبك. مثلاً: كيف أعمل زر بتصميم زجاجي؟</div>
  </div>

  <div class="chips" id="chips">
    <button type="button">شو الفرق بين div و span؟</button>
    <button type="button">كيف أخلّي الموقع يناسب الموبايل؟</button>
    <button type="button">كيف أعمل زر بتأثير hover؟</button>
  </div>

  <form id="form">
    <textarea id="input" placeholder="اكتب سؤالك هون..." maxlength="500" required></textarea>
    <button id="send" type="submit">إرسال</button>
  </form>
</main>

<script>
  const log = document.getElementById("log");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const send = document.getElementById("send");
  const chips = document.getElementById("chips");
  const history = [];

  // يحوّل ```كود``` و `كود` لعناصر آمنة (بدون innerHTML من النص الخام)
  function render(el, text) {
    el.textContent = "";
    text.split("```").forEach((part, i) => {
      if (i % 2 === 1) {
        const pre = document.createElement("pre");
        pre.textContent = part.replace(/^\w*\n/, "").trim();
        el.appendChild(pre);
      } else {
        part.split("`").forEach((p, j) => {
          if (j % 2 === 1) {
            const c = document.createElement("code");
            c.textContent = p;
            el.appendChild(c);
          } else el.appendChild(document.createTextNode(p));
        });
      }
    });
  }

  function addMsg(text, cls) {
    const d = document.createElement("div");
    d.className = "msg " + cls;
    render(d, text);
    log.appendChild(d);
    log.scrollTop = log.scrollHeight;
    return d;
  }

  async function ask(text) {
    chips.remove();
    addMsg(text, "me");
    history.push({ role: "user", content: text });
    const wait = addMsg("عم أكتب...", "bot typing");
    send.disabled = true;
    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ messages: history })
      });
      const data = await res.json();
      wait.className = "msg bot";
      render(wait, data.reply);
      history.push({ role: "assistant", content: data.reply });
    } catch (e) {
      wait.className = "msg bot";
      render(wait, "ما قدرت أتصل. جرّب كمان مرة.");
      history.pop();
    }
    send.disabled = false;
    log.scrollTop = log.scrollHeight;
    input.focus();
  }

  form.addEventListener("submit", e => {
    e.preventDefault();
    const t = input.value.trim();
    if (!t || send.disabled) return;
    input.value = "";
    ask(t);
  });
  input.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
  });
  chips.querySelectorAll("button").forEach(b => b.onclick = () => ask(b.textContent));
</script>
</body>
</html>
