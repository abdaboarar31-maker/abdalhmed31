<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>جميع الفيديوهات — عبد أبو عرار</title>
<link rel="icon" href="logo.svg">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=2">
</head>
<body>

<header class="top">
  <a class="brand" href="index.html"><img src="logo.svg" alt="" width="40" height="40"><span>عبد أبو عرار</span></a>
  <nav id="nav" class="nav">
    <a href="index.html">الرئيسية</a>
    <a href="css-designs.html">تصاميم CSS</a>
    <a href="store.html">المتجر</a>
  </nav>
  <button id="theme" class="icon-btn" aria-label="تبديل الوضع">🌙</button>
  <button id="burger" class="icon-btn burger" aria-label="القائمة">☰</button>
</header>

<main>
  <section class="wrap block">
    <h2 class="sec">جميع الفيديوهات</h2>
    <p class="muted mb">كل فيديو تحته ملف الكود. حمّله مجاناً.</p>
    <div id="vgrid" class="grid"></div>
  </section>
</main>

<footer>
  <div class="foot-brand"><img src="logo.svg" alt="" width="34" height="34"><b>عبد أبو عرار</b></div>
  <p class="credit">تصميم وتطوير: <b>عبد أبو عرار</b></p>
</footer>

<div id="modal" class="modal" hidden>
  <div class="mbox" role="dialog" aria-modal="true" aria-labelledby="mt">
    <button id="mclose" class="icon-btn mx" aria-label="X">✕</button>
    <div id="mplayer" class="player"></div>
    <h3 id="mt"></h3>
    <p id="md" class="muted"></p>
    <div id="ml"></div>
  </div>
</div>

<script src="videos-data.js"></script>
<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };

  var LANG = 'ar';
  try { LANG = localStorage.getItem('abd-lang') || 'ar'; } catch (e) {}
  if (LANG !== 'ar' && LANG !== 'en') LANG = 'ar';

  /* الوضع الفاتح والداكن */
  function setTheme(m) {
    document.documentElement.dataset.theme = m;
    $('#theme').textContent = m === 'light' ? '☀️' : '🌙';
    try { localStorage.setItem('abd-theme', m); } catch (e) {}
  }
  var th = 'dark';
  try { th = localStorage.getItem('abd-theme') || 'dark'; } catch (e) {}
  setTheme(th);
  $('#theme').addEventListener('click', function () {
    setTheme(document.documentElement.dataset.theme === 'light' ? 'dark' : 'light');
  });
  $('#burger').addEventListener('click', function () { $('#nav').classList.toggle('open'); });

  /* الفيديوهات */
  var VIDEOS = (typeof VIDEO_LIST !== 'undefined' && Array.isArray(VIDEO_LIST)) ? VIDEO_LIST : [];
  VIDEOS.forEach(function (v) { if (v.L) Object.assign(v, v.L[LANG] || v.L.ar || {}); });

  var DL = LANG === 'ar' ? '⬇️ حمّل ملف الكود' : '⬇️ Download the code';
  var YT = LANG === 'ar' ? 'افتح على يوتيوب' : 'Open on YouTube';
  var SOON = LANG === 'ar' ? 'قريباً' : 'Coming soon';

  function isSoonV(v) { return typeof isSoon === 'function' ? isSoon(v) : !!v.soon; }
  function linkAttrs(u) { return /^https?:/.test(u) ? 'target="_blank" rel="noopener"' : 'download'; }

  function render() {
    $('#vgrid').innerHTML = VIDEOS.map(function (v, i) {
      if (isSoonV(v)) {
        return '<article class="vcard soon"><div class="thumb"><span class="ph">⏳</span><span class="soon-b">' + SOON + '</span></div>' +
          '<div class="vinfo"><h3>' + esc(v.title || '') + '</h3><p>' + esc(v.desc || '') + '</p></div></article>';
      }
      var img = v.id
        ? '<img src="https://i.ytimg.com/vi/' + esc(v.id) + '/maxresdefault.jpg" alt="" loading="lazy" onerror="this.onerror=null;this.src=\'https://i.ytimg.com/vi/' + esc(v.id) + '/hqdefault.jpg\'">'
        : '<span class="ph">&lt;/&gt;</span>';
      return '<article class="vcard">' +
        '<button class="thumbbtn" data-v="' + i + '" type="button" aria-label="' + esc(v.title || '') + '"><div class="thumb">' + img +
        '<span class="play-b">▶</span>' + (v.dur ? '<em>' + esc(v.dur) + '</em>' : '') + '</div></button>' +
        '<div class="vinfo"><h3>' + esc(v.title || '') + '</h3><p>' + esc(v.desc || '') + '</p>' +
        (v.code ? '<a class="btn small dl" href="' + esc(v.code) + '" ' + linkAttrs(v.code) + '>' + DL + '</a>' : '') +
        '</div></article>';
    }).join('');
  }
  render();

  $('#vgrid').addEventListener('click', function (e) {
    var c = e.target.closest('[data-v]'); if (c) openVideo(+c.dataset.v);
  });

  function openVideo(i) {
    var v = VIDEOS[i]; if (!v) return;
    $('#mt').textContent = v.title || '';
    $('#md').textContent = v.desc || '';
    $('#mplayer').innerHTML = v.id
      ? '<iframe src="https://www.youtube-nocookie.com/embed/' + encodeURIComponent(v.id) + '?autoplay=1&rel=0" title="' + esc(v.title || '') + '" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>'
      : '';
    var links = v.id ? '<a class="btn small" href="https://www.youtube.com/watch?v=' + encodeURIComponent(v.id) + '" target="_blank" rel="noopener">' + YT + '</a>' : '';
    if (v.code) links += ' <a class="btn small ghost" href="' + esc(v.code) + '" ' + linkAttrs(v.code) + '>' + DL + '</a>';
    $('#ml').innerHTML = links;
    $('#modal').hidden = false;
    document.body.style.overflow = 'hidden';
  }
  function closeVideo() {
    $('#modal').hidden = true;
    $('#mplayer').innerHTML = '';
    document.body.style.overflow = '';
  }
  $('#mclose').addEventListener('click', closeVideo);
  $('#modal').addEventListener('click', function (e) { if (e.target.id === 'modal') closeVideo(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeVideo(); });
})();
</script>
</body>
</html>
