<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>جميع الفيديوهات — عبد أبو عرار</title>
<link rel="icon" href="logo.svg">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <a class="brand" href="index.html"><img src="logo.svg" alt="" width="40" height="40"><span>عبد أبو عرار</span></a>
  <nav class="nav"><a href="index.html" data-i18n="home">الرئيسية</a><a href="store.html" data-i18n="store">المتجر</a></nav>
  <select id="lang" class="lang" aria-label="Language"></select>
  <button id="theme" class="icon-btn" aria-label="theme">🌙</button>
</header>

<main class="wrap block">
  <h1 class="sec" data-i18n="h1">جميع الفيديوهات</h1>
  <p class="muted mb" data-i18n="hint">كل فيديو تحته ملف الكود، حمّله مجاناً.</p>
  <div id="chips" class="chips"></div>
  <div id="vgrid" class="grid"></div>
</main>

<footer>
  <div class="foot-brand"><img src="logo.svg" alt="" width="34" height="34"><b>عبد أبو عرار</b></div>
  <p class="credit" data-i18n-html="credit"></p>
  <p class="rights" data-i18n-html="rights"></p>
</footer>

<script src="videos-data.js"></script>
<script>
const T = {
ar: { name: 'العربية', dir: 'rtl', title: 'جميع الفيديوهات — عبد أبو عرار', home: 'الرئيسية', store: 'المتجر', h1: 'جميع الفيديوهات',
  hint: 'كل فيديو تحته ملف الكود، حمّله مجاناً.', dl: '⬇️ حمّل ملف الكود', soon: 'قريباً', premieres: 'ينزل', empty: 'ما في فيديوهات بهالقسم.',
  tags: { all: 'الكل', full: 'شرح كامل', quick: 'سريع' },
  credit: 'تصميم وتطوير: <b>عبد أبو عرار</b>', rights: '© {y} عبد أبو عرار. جميع الحقوق محفوظة.' },
en: { name: 'English', dir: 'ltr', title: 'All videos — Abd Abu Arar', home: 'Home', store: 'Store', h1: 'All videos',
  hint: 'Every video has its code file below it. Download it for free.', dl: '⬇️ Download the code', soon: 'Coming soon', premieres: 'Premieres', empty: 'No videos in this category.',
  tags: { all: 'All', full: 'Full course', quick: 'Quick' },
  credit: 'Designed & developed by <b>Abd Abu Arar</b>', rights: '© {y} Abd Abu Arar. All rights reserved.' }
};
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let LANG = 'ar', TAG = 'all';
try { LANG = localStorage.getItem('abd-lang') || 'ar'; } catch (e) {}
if (!T[LANG]) LANG = 'ar';
const t = k => T[LANG][k] || T.ar[k] || k;

function setTheme(m) {
  document.documentElement.dataset.theme = m; $('#theme').textContent = m === 'light' ? '☀️' : '🌙';
  try { localStorage.setItem('abd-theme', m); } catch (e) {}
}
let th = 'dark'; try { th = localStorage.getItem('abd-theme') || 'dark'; } catch (e) {}
setTheme(th);
$('#theme').addEventListener('click', () => setTheme(document.documentElement.dataset.theme === 'light' ? 'dark' : 'light'));

function render() {
  $('#chips').innerHTML = Object.entries(t('tags')).map(([k, v]) =>
    `<button class="chip ${k === TAG ? 'on' : ''}" data-c="${k}" type="button">${esc(v)}</button>`).join('');
  const list = VIDEO_LIST.filter(v => TAG === 'all' || v.tag === TAG);
  $('#vgrid').innerHTML = list.length ? list.map(v => { const L = v.L[LANG] || v.L.ar; return isSoon(v) ? `
    <article class="vcard st soon" id="v-${esc(v.id)}">
      <div class="thumb"><span class="ph">⏳</span><span class="soon-b">${t('soon')}</span></div>
      <div class="vinfo"><h3>${esc(L.title)}</h3><p>${esc(L.desc)}</p>
        <span class="btn small dl off">${t('premieres')} ${esc(soonWhen(v, LANG))}</span></div>
    </article>` : `
    <article class="vcard st" id="v-${esc(v.id)}">
      <a class="thumbbtn" href="https://www.youtube.com/watch?v=${encodeURIComponent(v.id)}" target="_blank" rel="noopener" aria-label="${esc(L.title)}">
        <div class="thumb"><img src="https://i.ytimg.com/vi/${esc(v.id)}/maxresdefault.jpg" alt="" loading="lazy" onerror="this.onerror=null;this.src='https://i.ytimg.com/vi/${esc(v.id)}/hqdefault.jpg'"><span class="play-b">▶</span><em>${esc(L.dur)}</em></div>
      </a>
      <div class="vinfo"><h3>${esc(L.title)}</h3><p>${esc(L.desc)}</p>
        ${v.code ? `<a class="btn small dl" href="${esc(v.code)}" download>${t('dl')}</a>` : ''}</div>
    </article>`; }).join('') : `<p class="muted">${t('empty')}</p>`;
}
$('#chips').addEventListener('click', e => { const c = e.target.closest('[data-c]'); if (c) { TAG = c.dataset.c; render(); } });

function applyLang(l) {
  LANG = l; try { localStorage.setItem('abd-lang', l); } catch (e) {}
  const d = document.documentElement; d.lang = l; d.dir = T[l].dir; document.title = T[l].title;
  $$('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  $$('[data-i18n-html]').forEach(el => el.innerHTML = t(el.dataset.i18nHtml).replace('{y}', new Date().getFullYear()));
  $('#lang').value = l; render();
  if (location.hash) { const el = document.getElementById(location.hash.slice(1)); if (el) el.scrollIntoView(); }
}
$('#lang').innerHTML = Object.keys(T).map(k => `<option value="${k}">${T[k].name}</option>`).join('');
$('#lang').addEventListener('change', e => applyLang(e.target.value));
applyLang(LANG);
</script>
</body>
</html>
